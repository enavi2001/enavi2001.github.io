<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>発信</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #6b7280; --btn: #2a9d8f; --btn-fg: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16181d; --fg: #e6e6e6; --muted: #9ca3af; } }
  body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--fg);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  .num { font-size: 28px; font-weight: 700; letter-spacing: 0.04em; margin: 16px 0 24px; }
  a.call { display: inline-block; padding: 16px 40px; border-radius: 12px; background: var(--btn);
           color: var(--btn-fg); font-size: 20px; font-weight: 700; text-decoration: none; }
  .note { color: var(--muted); font-size: 13px; margin-top: 20px; }
</style>
</head>
<body>
<div id="msg">電話番号がありません。</div>
<script>
  // ?n=0800-170-6807 の番号に発信する（数字・ハイフン・+ だけ受け付ける）。番号はページに書かず URL で受け取る
  (function () {
    var n = new URLSearchParams(location.search).get('n') || '';
    if (!/^\+?[0-9-]{6,20}$/.test(n)) return;
    var digits = n.replace(/-/g, '');
    var msg = document.getElementById('msg');
    msg.innerHTML = '';
    var num = document.createElement('div'); num.className = 'num'; num.textContent = n;
    var a = document.createElement('a'); a.className = 'call'; a.href = 'tel:' + digits; a.textContent = '📞 発信する';
    var note = document.createElement('div'); note.className = 'note';
    note.textContent = '発信の画面が出なければ、上のボタンを押してください。';
    msg.appendChild(num); msg.appendChild(a); msg.appendChild(note);
    location.href = 'tel:' + digits;
  })();
</script>
</body>
</html>
